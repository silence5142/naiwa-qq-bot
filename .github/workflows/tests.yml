name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run offline tests
        run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover -s tests -q
      - name: Check pip requirements
        shell: bash
        run: |
          uv export --locked --format requirements-txt --no-dev --no-emit-project --no-header --no-annotate --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
