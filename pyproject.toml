[project]
name = "naiwa-qq-bot"
version = "3.2.0"
description = "支持群聊记忆、联网搜索和图片理解的 QQ 机器人"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "aiohttp==3.14.5",
    "openai==3.41.0",
    "python-dotenv==1.2.4",
    "qq-botpy-v2==1.0.2",
]

[project.urls]
Repository = "https://github.com/silence5142/naiwa-qq-bot"
Issues = "https://github.com/silence5142/naiwa-qq-bot/issues"

[tool.uv]
package = false
required-version = ">=0.13.6"
